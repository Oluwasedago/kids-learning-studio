<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A3A68"/><stop offset="1" stop-color="#121A31"/></linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#F7C65A" stop-opacity=".38"/><stop offset="1" stop-color="#F7C65A" stop-opacity="0"/></radialGradient>
  <radialGradient id="gold" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFE9A3"/><stop offset=".45" stop-color="#F8C24A"/><stop offset="1" stop-color="#E08A1E"/></radialGradient>
  <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F58AAA"/><stop offset="1" stop-color="#C93C68"/></linearGradient>
  <linearGradient id="teal" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3CC4B8"/><stop offset="1" stop-color="#0F7A72"/></linearGradient>
  <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF9EE"/><stop offset="1" stop-color="#EADCC0"/></linearGradient>
  <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset=".5" stop-color="#000" stop-opacity=".28"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".10"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
  <filter id="drop" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#060A16" flood-opacity=".55"/></filter>
  <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
