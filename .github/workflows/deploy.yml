# Builds the app and publishes it on GitHub Pages at every push to main.
# (New concept: a GitHub Actions "workflow" is a list of steps GitHub runs on its own computers when something
# happens in the repo. Here: install, check, test, build, then hand the dist/ folder to GitHub Pages.)
# One-time setup on github.com: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # a "Run workflow" button on the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces an older run that is still going (every run publishes the
# whole site, so only the newest matters). Group renamed on 19 Oct 2026: a run stuck in "waiting" during a
# GitHub incident blocked the old "pages" group.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Secrets only here: the private-words list exists on the author's PC, never on GitHub.
      - run: npm run check-private
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
